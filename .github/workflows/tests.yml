name: Tests

on:
  push:
  pull_request:

jobs:
  recommendations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        env:
          AI_PROVIDER: local
        run: python -m unittest discover -s tests -v
